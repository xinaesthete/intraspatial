name: Version Packages

# Two halves, both driven by changesets/action:
#
# - `version`: whenever main has pending changesets, opens (or updates) the "Version packages" PR.
#   Merging that PR is the version bump.
# - `publish`: once main carries a version that isn't on npm yet (i.e. that PR was merged), waits
#   for approval on the `npm` environment, then runs `pnpm release` and pushes the tags and GitHub
#   Releases. It authenticates by npm trusted publishing (OIDC): there is no npm token anywhere in
#   this repo. See "Releasing" in README.md for the one-time npm and GitHub setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Create or update the version PR
    # `workflow_dispatch` can name any branch; only main versions or publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Pushes the version branch and opens the PR. Also needs the repo setting "Allow GitHub
    # Actions to create and approve pull requests" (Settings → Actions → General).
    permissions:
      contents: write
      pull-requests: write
    # Two quick merges must not race to rewrite the same version branch; let each run finish.
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      unpublished: ${{ steps.npm.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v5

      # The concurrency group serialises runs but doesn't order them: GitHub queues by when a job
      # starts waiting, so an older push's run can go after a newer one and would rewrite the
      # version PR from a stale main. If main has moved on, stop; the newer push's run covers it.
      - id: fresh
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $tip, not $GITHUB_SHA; skipping (the run for the newer push takes over)"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Same toolchain as ci.yml: the Node in .node-version, the pnpm in `packageManager`, then a
      # frozen `vp install` with the pnpm store cached.
      - if: steps.fresh.outputs.fresh == 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # changesets/action v2 requires @changesets/cli v3 (it hard-errors on v2) and uses the v2
      # input names below; v1's `version` / `title` / `commit` would be silently ignored. Move
      # the action's major and the root `@changesets/cli` devDependency together.
      # With no pending changesets it skips the version script and does nothing.
      - id: changesets
        if: steps.fresh.outputs.fresh == 'true'
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: Version packages
          commit-message: Version packages

      # Decides whether `publish` runs, so that a push with nothing to release doesn't sit waiting
      # for an approval. Only meaningful once no changesets are pending: until then, main's
      # versions are the already-published ones. Only a 404 counts as unpublished; any other
      # failure (registry down, network) fails the job rather than guessing.
      - id: npm
        if: steps.fresh.outputs.fresh == 'true' && steps.changesets.outputs.has-changesets == 'false'
        run: |
          set -euo pipefail
          unpublished=false
          for dir in . packages/deck; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if out=$(npm view "$name@$version" version 2>&1); then
              if [ "$out" != "$version" ]; then
                echo "::error::npm view $name@$version returned unexpected output: $out"
                exit 1
              fi
            elif grep -q 'code E404' <<<"$out"; then
              echo "$name@$version is not on npm"
              unpublished=true
            else
              echo "::error::npm view $name@$version failed"
              echo "$out"
              exit 1
            fi
          done
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the human checkpoint before anything reaches npm.
    # The npm trusted-publisher entries name this workflow file and this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/intraspatial
    permissions:
      # Tags and GitHub Releases.
      contents: write
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    # Never two publishes at once; never cancel one in flight.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Does the same OIDC exchange `pnpm publish` will, once per package, and fails with npm's
      # reason if it's refused. pnpm only warns ("Skipped OIDC: ...") and publishes with no
      # credentials, and `changeset publish` captures that warning, so all that reaches the log
      # otherwise is "E404 ... PUT https://registry.npmjs.org/<name>". Tokens are masked and the
      # exchanged token is discarded.
      - name: Check npm trusted publishing
        run: |
          set -euo pipefail
          id_url=$(node -p 'const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); u.searchParams.set("audience", "npm:registry.npmjs.org"); u.href')
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$id_url" | node -p 'JSON.parse(require("fs").readFileSync(0)).value')
          echo "::add-mask::$id_token"
          ok=true
          for dir in . packages/deck; do
            name=$(node -p "require('./$dir/package.json').name")
            status=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" -H 'Content-Length: 0' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")
            # Any 2xx is success (npm documents 201; pnpm checks `response.ok`). A success body
            # holds the unmasked publish token, so only a refusal's body is ever printed.
            if [[ "$status" == 2?? ]]; then
              echo "$name: trusted publishing OK ($status)"
            else
              echo "::error::$name: npm refused the OIDC exchange ($status): $(cat "$RUNNER_TEMP/exchange.json")"
              ok=false
            fi
            rm -f "$RUNNER_TEMP/exchange.json"
          done
          [ "$ok" = true ] || {
            echo "Check each package's trusted publisher on npmjs.com: xinaesthete / intraspatial / release.yml / environment npm (case-sensitive)."
            exit 1
          }

      # No `registry-url`: that writes an .npmrc with a NODE_AUTH_TOKEN placeholder, and the
      # OIDC exchange needs no token. pnpm 11 performs the exchange itself.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # With no changesets pending, the action goes straight to `publish-script`: `pnpm release`
      # builds both packages, runs check:publish, and `changeset publish`es whatever isn't on npm.
      # The action then pushes the `name@version` tags and creates a GitHub Release for each.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
