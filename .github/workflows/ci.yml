name: CI

# The code gates. The docs site (and the playground build it embeds) has its own workflow,
# deploy-docs.yml, because it also publishes to Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this push/PR touches anything the test suites could notice. A Changesets version PR
  # (versions + changelogs) or a docs-only change skips the tests and fallow; format/lint/typecheck
  # and the publish checks still run. See scripts/ci-changes.mjs for what counts as inert.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # Depth 2: on a PR the checkout is the merge commit, whose first parent is the base tip, so
      # HEAD^1..HEAD is exactly what merging would change.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/ci-changes.mjs HEAD^1 HEAD ;;
            # A diff needs only the two trees, not the history between them.
            push) git fetch -q --depth=1 origin "$BEFORE" || true
                  node scripts/ci-changes.mjs "$BEFORE" HEAD ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT" ;;
          esac

  check:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs Vite+, the Node in .node-version and the pnpm in `packageManager`, then runs
      # `vp install` (pnpm install, frozen on CI) with the pnpm store cached.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # Oxfmt format check + Oxlint, one pass.
      - run: vp check

      # Type-aware lint rules (tsgolint) over the engine. The playground is left out: its
      # React/three type surface sends the TS 7 checker past 8 GB (see package.json `lint:types`).
      - run: vp run lint:types

      # tsc over core and deck (TS 7) and the playground (TS 5.9, see scripts/tsc-5.mjs).
      - run: vp run typecheck

  test-cpu:
    name: Tests (CPU)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run test:cpu

  test-gpu:
    name: Tests (GPU, software Vulkan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned, not ubuntu-latest: the prebuilt Dawn binary needs glibc >= 2.38 (24.04 has 2.39;
    # Debian bookworm's 2.36 fails to dlopen it).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Hosted runners have no GPU. Dawn (the `webgpu` addon) runs on Mesa's lavapipe, a CPU
      # Vulkan driver, and the kernels, the TGSL transform and the readback paths are the same
      # code a real adapter runs, so a correctness failure here is a real one. Measured in an
      # Ubuntu 24.04 container (2026-10-26): the full suite passes (283 tests) in ~9 s.
      #
      # The .debs are cached: the one apt fetches (mesa-vulkan-drivers, 17.5 MB) has taken from
      # 9 s to 6.5 min depending on the Azure mirror. The key is the runner image, so the cached
      # set is exactly what that image lacks and `dpkg -i` needs no dependency resolution; a new
      # image (about weekly) refetches once.
      - name: Runner image (lavapipe cache key)
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: lavapipe
        uses: actions/cache/restore@v4
        with:
          path: ~/lavapipe-debs/*.deb
          key: lavapipe-${{ steps.image.outputs.id }}
      - name: Install Mesa software Vulkan (lavapipe)
        id: install
        env:
          HIT: ${{ steps.lavapipe.outputs.cache-hit }}
        run: |
          set -euo pipefail
          debs="$HOME/lavapipe-debs"
          if [ "$HIT" != true ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends --download-only \
              -o Dir::Cache::archives="$debs" mesa-vulkan-drivers libvulkan1
          fi
          # Nothing downloaded means the image already has both.
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo dpkg -i "$debs"/*.deb
            echo "debs=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.lavapipe.outputs.cache-hit != 'true' && steps.install.outputs.debs == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/lavapipe-debs/*.deb
          key: ${{ steps.lavapipe.outputs.cache-primary-key }}

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run test:gpu

  build:
    name: Library build + publish checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # What `pnpm release` builds before `changeset publish`, minus the publish: both packages'
      # dist/ (pre-transformed kernels + declarations), then publint and arethetypeswrong over
      # the packed tarballs.
      - run: vp run build:lib
      - run: vp run --filter @intraspatial/deck --fail-if-no-match build
      - run: vp run check:publish

  fallow:
    name: Code health (fallow, non-blocking)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Dead code / complexity / duplication scoped to the changed files, new-vs-inherited
    # attributed. Non-blocking until the committed baselines are trusted.
    continue-on-error: true
    steps:
      # Full history: the audit diffs against the merge base with main, which a depth-1 clone
      # does not have ("no merge base").
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: |
          vp exec fallow audit --base "origin/${{ github.base_ref }}" --format github-annotations
