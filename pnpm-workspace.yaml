# pnpm workspace: the root engine package (`intraspatial`), the packages built on it
# (`packages/*`: `@intraspatial/deck`, the deck.gl layers), and the two front-end apps that
# reuse them (the React Flow composer and the Astro docs site). One lockfile, one
# `pnpm install`, shared deps hoisted — and worktrees install cleanly instead of
# each package needing its own install. The external `openjph-wasm` sibling is kept
# out of the worktree-fragile hard-dependency path (see root package.json).
#
# Inside the workspace, packages resolve each other's SOURCE through the `@intraspatial/source`
# export condition (each app's Vite `resolve.conditions`, each tsconfig's `customConditions`), so
# nothing needs building to develop against it. Published consumers never set that condition and
# get `dist/`.
packages:
  - packages/*
  - playground
  - docs-site
# Build scripts we trust to run on install:
#   webgpu — the Dawn native addon (required for the GPU vitest suite)
#   sharp  — docs-site (Astro) image processing
#   esbuild — vite/vitest bundler platform binary
allowBuilds:
  esbuild: true
  sharp: true
  webgpu: true
# Shared, version-coupled tooling declared once so it can't drift across packages.
# typegpu ↔ unplugin-typegpu MUST match (the plugin transpiles "use gpu" kernels for that exact
# typegpu version) — a mismatch silently breaks the GPU sims. Referenced as `catalog:` below.
catalog:
  typegpu: ^0.11.9
  unplugin-typegpu: 0.11.6
  typescript: ^7.0.0
# Exact-version exemption from pnpm 11's minimum release age; drop once the release has aged.
minimumReleaseAgeExclude:
  - '@spatialdata/avivatorish@0.12.0'
  - '@spatialdata/core@0.12.0'
  - '@spatialdata/layers@0.12.0'
  - '@spatialdata/react@0.12.0'
  - '@spatialdata/vis@0.12.0'
  - zarrextra@0.5.1
