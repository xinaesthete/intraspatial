<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcript co-location modes</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b1020; color: #e2e8f0; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #root { padding: 16px; }
    h2.page { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    p.page { margin: 0 0 14px; color: #94a3b8; font-size: 12px; max-width: 820px; }
    h3 { margin: 18px 0 6px; font-size: 13px; font-weight: 600; }
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .controls label { display: flex; flex-direction: column; gap: 3px; color: #cbd5e1; font-size: 12px; }
    .controls .row { display: flex; gap: 6px; align-items: center; }
    .controls input:not([type=range]), .controls select { background: #111827; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 3px 6px; font: inherit; min-width: 0; flex: 1; }
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
    .views { min-width: 0; }
    canvas.overview { width: 100%; display: block; border-radius: 4px; cursor: move; touch-action: none; }
    canvas.modemap { width: 100%; display: block; border-radius: 4px; transform: scaleY(-1); }
    .status { color: #94a3b8; font-size: 12px; min-height: 18px; margin: 6px 0; }
    .error { color: #f87171; }
    .hint { color: #64748b; font-size: 11px; margin: 4px 0; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 8px 0; font-size: 12px; }
    .legend-head { color: #cbd5e1; font-weight: 600; }
    .legend-row { color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #334155; }
    .matrix { display: grid; gap: 1px; font-size: 11px; }
    .matrix-label { color: #94a3b8; padding-right: 6px; white-space: nowrap; line-height: 18px; }
    .matrix-cell { width: 18px; height: 18px; }
    .picker { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #1e293b; padding-top: 8px; }
    .picker-head { color: #cbd5e1; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; }
    .chip.on { background: #334155; border-color: #fbbf24; }
    .chip-note { color: #94a3b8; }
    .explainers { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 820px; }
    details.explain { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 6px 10px; }
    details.explain summary { cursor: pointer; color: #cbd5e1; font-weight: 600; }
    .explain-body { color: #94a3b8; margin-top: 6px; }
    .explain-math { margin-top: 6px; overflow-x: auto; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/transcriptModesMain.tsx"></script>
</body>

</html>
