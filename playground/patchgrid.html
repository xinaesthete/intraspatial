<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patch grid (prototype)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b1020; color: #e2e8f0; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #root { padding: 16px; }
    h2.page { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #fbbf24; border: 1px solid #fbbf24; border-radius: 3px; padding: 0 4px; vertical-align: middle; }
    p.page { margin: 0 0 14px; color: #94a3b8; font-size: 12px; max-width: 820px; }
    code { background: #0f172a; border: 1px solid #334155; border-radius: 3px; padding: 0 3px; font-size: 11px; }
    h3 { margin: 10px 0 0; font-size: 13px; font-weight: 600; }
    .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .controls { display: flex; flex-direction: column; gap: 8px; }
    .controls label { display: flex; flex-direction: column; gap: 3px; color: #cbd5e1; font-size: 12px; }
    .controls label.disabled { color: #64748b; }
    .controls .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .controls input:not([type=range]):not([type=checkbox]):not([type=file]) { background: #111827; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 3px 6px; font: inherit; min-width: 0; flex: 1; }
    .controls label.check { flex-direction: row; align-items: center; gap: 6px; }
    .controls label.check input { flex: none; }
    .controls label.file { flex-direction: row; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
    .controls label.file input { display: none; }
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:disabled { color: #64748b; cursor: default; }
    table.stats, table.hits { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    table.stats th { text-align: left; color: #94a3b8; font-weight: 500; padding: 1px 10px 1px 0; vertical-align: top; }
    table.stats td { color: #e2e8f0; padding: 1px 0; }
    td.kept, tr.kept td { color: #fbbf24; }
    table.hits { margin-top: 8px; }
    table.hits th { text-align: left; color: #94a3b8; font-weight: 500; padding: 1px 12px 1px 0; }
    table.hits td { padding: 1px 12px 1px 0; color: #cbd5e1; }
    .views { min-width: 0; }
    .deck-canvas { position: relative; height: min(72vh, 760px); min-height: 360px; border-radius: 4px; overflow: hidden; background: #070b16; border: 1px solid #1e293b; }
    .status { color: #94a3b8; font-size: 12px; min-height: 18px; margin: 6px 0; }
    .error { color: #f87171; font-size: 12px; margin: 0; }
    .hint { color: #64748b; font-size: 11px; margin: 0; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 8px; font-size: 12px; }
    .legend-row { color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 2px; display: inline-block; border: 1px solid #334155; }
    svg.chart { width: 100%; height: auto; background: #0f172a; border: 1px solid #1e293b; border-radius: 4px; }
    .chart-title { fill: #cbd5e1; font-size: 10px; }
    .chart-tick { fill: #94a3b8; font-size: 9px; }
    .chart-guide { stroke: #1e293b; }
    .chart-marker { stroke: #f8fafc; stroke-dasharray: 2 2; }
    .explainers { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 820px; }
    details.explain { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 6px 10px; }
    details.explain summary { cursor: pointer; color: #cbd5e1; font-weight: 600; }
    .explain-body { color: #94a3b8; margin-top: 6px; }
    .explain-math { margin-top: 6px; overflow-x: auto; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/patchGridMain.tsx"></script>
</body>

</html>
