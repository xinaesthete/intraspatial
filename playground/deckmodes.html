<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcript modes on deck.gl</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b1020; color: #e2e8f0; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #root { height: 100%; }
    .deck-page { height: 100%; display: flex; flex-direction: column; padding: 12px 16px; gap: 6px; }
    h2.page { margin: 0; font-size: 15px; font-weight: 600; }
    .status { color: #94a3b8; font-size: 12px; margin: 0; }
    .error { color: #f87171; }
    .row { display: flex; gap: 18px; align-items: center; font-size: 12px; color: #cbd5e1; }
    select { background: #111827; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 2px 6px; }
    .deck-canvas { flex: 1; min-height: 0; position: relative; border-radius: 4px; overflow: hidden; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 8px 0; font-size: 12px; }
    .legend-head { color: #cbd5e1; font-weight: 600; }
    .legend-row { color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #334155; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/deckModesMain.tsx"></script>
</body>

</html>
